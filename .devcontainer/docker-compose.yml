services:
  app:
    container_name: spec-viewer
    build:
      context: ./node
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    ports:
      - "14000:14000"
      - "14001:14001"
      - "16080:16080"
      - "15901:15901"
    command: sleep infinity
    tmpfs:
      - /var/tmp/codex-sqlite:size=1g
    environment:
      CODEX_SQLITE_HOME: /var/tmp/codex-sqlite
