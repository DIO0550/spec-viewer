name: backend

on:
  pull_request:

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-check:
    name: fmt / clippy / coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: spec-viewer/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev

      - name: Install Rust components with rustup
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --component llvm-tools-preview
          rustup default stable

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Run Rust acceptance tests with JUnit
        run: |
          mkdir -p .config
          printf '%s\n' \
            '[profile.ci]' \
            'fail-fast = false' \
            '[profile.ci.junit]' \
            'path = "junit.xml"' \
            > .config/nextest.toml
          cargo nextest run --workspace --all-features --profile ci

      - name: Upload backend JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-junit
          path: spec-viewer/src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Install cargo-llvm-cov
        if: always()
        run: cargo install cargo-llvm-cov --locked

      - name: Generate coverage
        if: always()
        run: |
          cargo llvm-cov --workspace --text --output-path coverage.txt
          SUMMARY_JSON=$(cargo llvm-cov --workspace --json --summary-only)
          status_for() {
            local pct=$1
            if awk "BEGIN{exit !(${pct} >= 80)}"; then echo '🟢'
            elif awk "BEGIN{exit !(${pct} >= 50)}"; then echo '🟡'
            else echo '🔴'
            fi
          }
          LINES=$(printf '%.2f' "$(echo "$SUMMARY_JSON" | jq -r '.data[0].totals.lines.percent // 0')")
          FUNCTIONS=$(printf '%.2f' "$(echo "$SUMMARY_JSON" | jq -r '.data[0].totals.functions.percent // 0')")
          REGIONS=$(printf '%.2f' "$(echo "$SUMMARY_JSON" | jq -r '.data[0].totals.regions.percent // 0')")
          S_LINES=$(status_for "$LINES")
          S_FUNCS=$(status_for "$FUNCTIONS")
          S_REGNS=$(status_for "$REGIONS")
          {
            echo '## Backend Coverage (cargo-llvm-cov)'
            echo
            echo "Commit: \`${GITHUB_SHA:0:7}\` — 凡例: 🟢 ≥80 / 🟡 50-79 / 🔴 <50"
            echo
            echo '| Status | Metric | Percentage |'
            echo '| :---: | --- | ---: |'
            echo "| ${S_LINES} | Lines | ${LINES}% |"
            echo "| ${S_FUNCS} | Functions | ${FUNCTIONS}% |"
            echo "| ${S_REGNS} | Regions | ${REGIONS}% |"
            echo
            echo '<details><summary>Per-line coverage</summary>'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
            echo
            echo '</details>'
          } > "$GITHUB_WORKSPACE/coverage.md"

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: coverage.md
          if-no-files-found: ignore
          retention-days: 1

  windows-review:
    name: Windows review regression
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        working-directory: spec-viewer
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Install stable Rust and Windows target
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustup target add x86_64-pc-windows-msvc

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked

      - name: Configure JUnit
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/.config | Out-Null
          @'
          [profile.ci]
          fail-fast = false
          [profile.ci.junit]
          path = "junit.xml"
          '@ | Set-Content -Encoding utf8 src-tauri/.config/nextest.toml

      - name: Test Windows review and persistence paths
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --all-features --profile ci

      - name: Upload Windows JUnit
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-junit
          path: spec-viewer/src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: error
          retention-days: 7

      - name: Clippy Windows targets
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --all-targets --all-features -- -D warnings

  coverage-comment:
    name: post coverage comment
    needs: backend-check
    if: always() && needs.backend-check.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Download coverage artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-coverage
          path: .

      - name: Post coverage comment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_MARKER: "<!-- backend-coverage -->"
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY_FILE=coverage-comment.md
          {
            echo "$COMMENT_MARKER"
            cat coverage.md
          } > "$BODY_FILE"

          COMMENT_ID="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --jq ".[] | select(.body | contains(\"${COMMENT_MARKER}\")) | .id" \
              | head -n 1
          )"

          if [ -n "$COMMENT_ID" ]; then
            gh api \
              --method PATCH \
              "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
              --field body=@"$BODY_FILE"
          else
            gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              --field body=@"$BODY_FILE"
          fi
