name: Storybook Visual Candidate

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: storybook-visual-candidate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  visual-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout PR head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          package_json_file: spec-viewer/package.json

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install dependencies
        working-directory: spec-viewer
        run: pnpm install --frozen-lockfile

      - name: Install Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          fc-cache -f

      - name: Build Storybook
        working-directory: spec-viewer
        run: pnpm build-storybook

      - name: Capture required visual tuples
        working-directory: spec-viewer
        run: >-
          pnpm visual:capture --
          --storybook-dir storybook-static
          --out ../visual-candidate
          --cases src/tests/acceptance/review-vrt-cases.json
          --head-sha ${{ github.event.pull_request.head.sha }}

      - name: Upload immutable visual candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-candidate
          path: visual-candidate/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
          include-hidden-files: false
